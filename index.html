<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Signage Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dashboard landscape" id="dashboard">
      <header class="header">
        <h1 id="title">Computer Science Department</h1>
        <label for="cityName">City:</label>
        <input type="text" id="cityName" name="cityName" /><br /><br />
        <button id="submitBtn" class="submitBtn" onclick="handleSubmit()">
          Update
        </button>
        <input
          type="checkbox"
          id="Geolocation"
          name="Geolocation"
          checked
          onchange="handleUpdate()"
        />
        <label for="Geolocation">Use Geolocation</label>
      </header>

      <section class="clock-panel">
        <h2>Time</h2>
        <div class="clock">12:00 PM</div>
        <div class="date">Monday, May 4, 2026</div>
      </section>

      <section class="weather-panel">
        <h2>Weather</h2>
        <div id="weather-location" class="weather-location">
          Loading location...
        </div>
        <div id="weather-temp" class="weather-temp">Loading...</div>
        <div id="weather-condition" class="weather-condition">
          Fetching weather...
        </div>
      </section>

      <section class="news-panel">
        <h2>News</h2>
        <div id="news-source" class="news-source">BBC News</div>
        <div id="news-container">
          <p class="cycle-item">Loading news...</p>
        </div>
      </section>

      <section class="announcements-panel">
        <h2>Announcements</h2>
        <div id="announcements-container">
          <p class="cycle-item">Loading announcements...</p>
        </div>
      </section>

      <section class="events-panel">
        <h2>Events</h2>
        <div id="events-container">
          <p>Loading events...</p>
        </div>
      </section>

      <section class="comics-panel">
        <h2>Comics</h2>
        <div id="comics-container">
          <p class="cycle-item">Loading comics...</p>
        </div>
      </section>

      <footer class="footer">
        <p id="footer-text">Room for future footer content</p>
      </footer>
    </div>

    <button class="theme-toggle" id="theme-btn">Switch to ☀️ Light</button>
    <button class="orientation-toggle" id="orientation-btn">
      Switch to Portrait
    </button>

    <script src="app.js"></script>
  </body>
</html>
