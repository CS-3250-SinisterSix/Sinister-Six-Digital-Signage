<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Signage Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard">
    <header class="header">
      <h1 id="title">Computer Science Department</h1>
      <label for="cityName">City:</label>
      <input type="text" id="cityName" name="cityName"><br><br>
      <button id="submitBtn" class="submitBtn" onclick="handleSubmit()">Update</button>
      <input type="checkbox" id="Geolocation" name="Geolocation" checked>
      <label for="Geolocation">Use Geolocation</label>
    </header>

    <section class="clock-panel">
      <h2>Time</h2>
      <div class="clock">12:00 PM</div>
      <div class="date">Monday, April 13, 2026</div>
    </section>

    <section class="weather-panel">
      <h2>Weather</h2>
      <div id="weather-location" class="weather-location">Loading location...</div>
      <div id="weather-temp" class="weather-temp">Loading...</div>
      <div id="weather-condition" class="weather-condition">Fetching weather...</div>
      <button id="updateBtn" class="updateBtn" onclick="handleUpdate()">Refresh Weather</button>
    </section>

    <section class="announcements-panel">
      <h2>News</h2>
      <div id="news-source" class="news-source">BBC News</div>
      <div id="news-container">
        <p class="headline">Loading news...</p>
      </div>
    </section>

    <section class="extra-panel">
      <h2>Extra</h2>
      <p>This area can be used later for events, images, news, or reminders.</p>
    </section>

    <footer class="footer">
      <p id="footer-text">Room for future footer content</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
